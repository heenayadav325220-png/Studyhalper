<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81" />
      <stop offset="40%" stop-color="#4338ca" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with subtle border radius -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Subtle inner border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#6366f1" stroke-width="4" stroke-opacity="0.3" />

  <!-- Outer ambient glow ring -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.4" />

  <!-- Central Emblem: Graduation Cap / Ascend Diamond -->
  <g transform="translate(0, -10)" filter="url(#glow)">
    <!-- Mortarboard Top / Rhombus -->
    <path d="M256 120 L416 195 L256 270 L96 195 Z" fill="url(#capGrad)" />
    
    <!-- Cap Underneath Base -->
    <path d="M160 228 L160 290 C160 340, 352 340, 352 290 L352 228 L256 272 Z" fill="#c7d2fe" />
    
    <!-- Tassel String & Bob -->
    <path d="M380 205 Q410 240 405 285" fill="none" stroke="url(#accentGrad)" stroke-width="8" stroke-linecap="round" />
    <circle cx="405" cy="295" r="14" fill="url(#accentGrad)" />
    
    <!-- Center Sparkle Star -->
    <path d="M256 160 Q256 195 235 195 Q256 195 256 230 Q256 195 277 195 Q256 195 256 160 Z" fill="#4f46e5" />
  </g>

  <!-- ASCEND Text -->
  <text x="256" y="405" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="34" fill="#ffffff" letter-spacing="6">ASCEND STUDY</text>
  
  <!-- Subtitle -->
  <text x="256" y="440" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="14" fill="#a5b4fc" letter-spacing="3">AI STUDY COMPANION</text>
</svg>
