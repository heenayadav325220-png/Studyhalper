name: Android Build
on:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Decode Keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -Eeuo pipefail
          test -n "$RELEASE_KEYSTORE_BASE64" || {
            echo "::error::RELEASE_KEYSTORE_BASE64 is empty"
            exit 1
          }
          printf '%s' "$RELEASE_KEYSTORE_BASE64" \
            | tr -d '\r\n' \
            | base64 --decode > android/app/release.keystore || {
              echo "::error::RELEASE_KEYSTORE_BASE64 is not valid standard Base64"
              exit 1
            }
          test -s android/app/release.keystore

      - name: TEMP - Backup Keystore For User
        uses: actions/upload-artifact@v4
        with:
          name: keystore-backup-for-user
          path: android/app/release.keystore
          retention-days: 1

      - name: Build Android App
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          gradle assembleDebug
          gradle assembleRelease

      - name: Prepare APK Artifacts
        run: |
          # Copy release build for clean naming
          cp android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/apk/release/ASCEND_STUDY-release.apk
          # Copy debug build for clean naming
          cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/ASCEND_STUDY-debug.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ASCEND_STUDY-debug-apk
          path: android/app/build/outputs/apk/debug/ASCEND_STUDY-debug.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: ASCEND_STUDY-release-apk
          path: android/app/build/outputs/apk/release/ASCEND_STUDY-release.apk
